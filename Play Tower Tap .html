<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tower Tap</title>
<script src="https://www.youtube.com/game_api/v1"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#dfe7ff;--ink:#1b2340;--card:#fffffff0;--muted:#5b6485;--accent:#ff4f79;--accent-ink:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1226;--ink:#f1f4ff;--card:#1b2342f0;--muted:#a3acd3;--accent:#ff7a96;--accent-ink:#2a0d18}}
:root[data-theme="dark"]{--bg:#0d1226;--ink:#f1f4ff;--card:#1b2342f0;--muted:#a3acd3;--accent:#ff7a96;--accent-ink:#2a0d18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,'Nunito','Segoe UI',system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;display:flex;justify-content:center}
#game{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#score{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:76px;font-weight:700;line-height:1;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.22);pointer-events:none;transition:opacity .3s}
#score.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#best{position:absolute;top:16px;left:16px;font-weight:700;font-size:16px;color:#fff;background:rgba(0,0,0,.2);padding:6px 12px;border-radius:999px;pointer-events:none}
#mute{position:absolute;top:12px;right:12px;width:44px;height:44px;padding:0;font-size:20px;border-radius:50%;background:rgba(0,0,0,.2);box-shadow:none;color:#fff}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .3s}
.hidden{opacity:0;pointer-events:none}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:28px;padding:26px 26px 22px;text-align:center;max-width:310px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.card h1,.card h2{margin:6px 0 8px;font-size:38px;line-height:1.05}
.card p{margin:0 0 18px;color:var(--muted);font-size:17px;line-height:1.35}
.card .big{font-size:72px;font-weight:700;line-height:1}
.card small{display:block;margin-top:14px;color:var(--muted);font-size:14px}
.logo{font-size:44px;display:inline-block;animation:bob 1.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}.streak{margin:0 0 10px;font-weight:700;font-size:15px;color:var(--accent)}.themes{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;margin-top:14px}.sep{flex-basis:100%;height:0}.chip{padding:6px 11px;font-size:18px;box-shadow:none;background:rgba(127,127,127,.2);color:var(--ink);border:2px solid transparent}.chip.on{border-color:var(--accent)}.chip.lock{opacity:.5;font-size:14px}#board{z-index:5;background:rgba(0,0,0,.45)}#board .card{width:300px}#board ol{list-style:none;margin:10px 0 6px;padding:0;text-align:left}#board li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;font-size:18px}#board li.me{background:rgba(255,79,121,.2);font-weight:700}#board li b{width:30px}#board li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#board li em{font-style:normal;font-weight:700}#board li.empty{color:var(--muted);justify-content:center}#bnote{margin:6px 0 14px;font-size:14px}#lrank{position:absolute;top:54px;left:16px;font-weight:700;font-size:16px;color:#fff;background:rgba(0,0,0,.2);padding:6px 12px;border-radius:999px;pointer-events:none;transition:opacity .3s}#tb{position:absolute;bottom:14px;right:12px;width:44px;height:44px;padding:0;font-size:20px;border-radius:50%;background:rgba(0,0,0,.2);box-shadow:none;color:#fff}#life{position:absolute;top:92px;left:16px;font-size:22px;pointer-events:none;transition:opacity .2s}.rank{font-weight:700;font-size:20px;color:var(--accent);margin:2px 0 4px}.ghost{margin-top:12px;font-size:16px;padding:8px 24px;background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--muted)}
button{font:inherit;font-weight:700;font-size:22px;padding:14px 44px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 rgba(0,0,0,.22);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){#score.pop,.logo{animation:none}}
#boot{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--bg);color:var(--ink);font-weight:700;font-size:26px}#boot b{font-size:64px}
</style>
</head>
<body>
<div id="boot"><b>🧱</b>Tower Tap<span style="font-size:16px;font-weight:500">Loading…</span></div>
<div id="game">
  <canvas id="c"></canvas>
  <div id="best">Best 0</div>
  <div id="lrank" style="opacity:0"></div><button id="tb" data-board aria-label="Leaderboard">🏆</button><div id="life" style="opacity:0">❤️</div>
  
  <div id="score" style="opacity:0">0</div>
  <div id="menu" class="overlay">
    <div class="card">
      <div class="logo">🧱</div>
      <h1>Tower Tap</h1>
      <p>Tap to drop each block. Line it up perfectly to keep it wide. How high can you build?</p>
      <button id="go">Play</button><br><button class="ghost" data-board>🏆 Leaderboard</button>
      <div class="streak" id="streak"></div><small>Tap anywhere or press Space</small><div class="themes"></div>
    </div>
  </div>
  <div id="board" class="overlay hidden"><div class="card"><h2 id="btitle">Leaderboard</h2><ol id="blist"></ol><p id="bnote"></p><button id="bclose">Close</button></div></div>
  <div id="over" class="overlay hidden">
    <div class="card">
      <h2>Game over</h2>
      <div class="rank" id="rank"></div><div class="big" id="fs">0</div>
      <p id="fb">Best 0</p>
      <button id="again">Play again</button><br> <button class="ghost" data-board aria-label="Leaderboard">🏆</button><div class="themes"></div>
    </div>
  </div>
</div>
<script>
(async()=>{
const inYT=typeof ytgame!=='undefined'&&!!ytgame.IN_PLAYABLES_ENV;
let yp=false,ytA=true,looping=true,saveT=0;const mem={};
if(inYT)ytgame.game.firstFrameReady();
if(inYT){try{const d=await ytgame.game.loadData();if(d)Object.assign(mem,JSON.parse(d))}catch(e){}try{ytA=!!ytgame.system.isAudioEnabled()}catch(e){}}
function flush(){clearTimeout(saveT);if(inYT)try{ytgame.game.saveData(JSON.stringify(mem)).catch(()=>{})}catch(e){}}
let realLS=null;try{realLS=window.localStorage}catch(e){}
const localStorage=inYT?{getItem:k=>(k in mem?mem[k]:null),setItem:(k,v)=>{mem[k]=String(v);clearTimeout(saveT);saveT=setTimeout(flush,400)}}:(realLS||{getItem:()=>null,setItem(){}});
const W=420,BH=26,$=id=>document.getElementById(id),cvs=$('c'),ctx=cvs.getContext('2d');
let cw,ch,s,dpr,state='ready',stack,cur,dir,speed,cam=0,combo,score,best=0,pieces=[],fx=[],pops=[],muted=false,shake=0,bgH=205,canRestart=false,ac,parts=[],life=0,bestLvl=0,streak=1,mus=null,mTimer=0,mStep=0,mNext=0,db=null,usr=null,uid=null,rows=[],names={},runs=[],paused=false,lastR=99,tm=0;
const bubbles=Array.from({length:16},()=>({x:Math.random(),y:Math.random(),r:20+Math.random()*50,p:.15+Math.random()*.5}));
const stars=Array.from({length:40},()=>({x:Math.random(),y:Math.random()*.7,r:.8+Math.random()*1.6}));
const vib=()=>{};
const TH=[{n:'Candy',u:0,h:205,st:8,sl:70,sd:68,e:'🍬'},{n:'Sunset',u:15,h:340,st:7,sl:80,sd:62,e:'🌅'},{n:'Neon',u:35,h:170,st:11,sl:90,sd:20,e:'⚡'},{n:'Gold',u:70,h:40,st:3,sl:90,sd:45,e:'👑'}];
let ti=0;const T=()=>TH[ti];
const PK=[{k:'rb',u:30,e:'🌈',n:'Rainbow Trail'},{k:'mg',u:50,e:'🧲',n:'Magnet'}],pk={rb:1,mg:1},pa={rb:false,mg:false};
const lifeUI=()=>{$('life').style.opacity=life?1:0};
function renderThemes(){document.querySelectorAll('.themes').forEach(el=>{el.innerHTML=TH.map((t,i)=>best>=t.u?`<button class="chip${i===ti?' on':''}" data-i="${i}" aria-label="${t.n} theme">${t.e}</button>`:`<button class="chip lock" disabled aria-label="${t.n} locked">🔒${t.u}</button>`).join('')+'<i class="sep"></i>'+PK.map(p=>best>=p.u?`<button class="chip${pk[p.k]?' on':''}" data-p="${p.k}" aria-label="${p.n} (tap to toggle)">${p.e}</button>`:`<button class="chip lock" disabled aria-label="${p.n} locked">🔒${p.u}</button>`).join('')})}
function burst(x,i,w,n,h){for(let k=0;k<n;k++)parts.push({x:x+Math.random()*w,i,y:0,vx:(Math.random()-.5)*260,vy:-80-Math.random()*220,a:1,h:h+Math.random()*60})}
try{best=+localStorage.getItem('towertap-best')||0}catch(e){}
$('best').textContent='Best '+best;

try{ti=+localStorage.getItem('towertap-theme')||0;bestLvl=+localStorage.getItem('towertap-lvl')||0;const d=new Date().toDateString(),o=JSON.parse(localStorage.getItem('towertap-streak')||'{}');streak=o.d===d?o.n:o.d===new Date(Date.now()-864e5).toDateString()?o.n+1:1;localStorage.setItem('towertap-streak',JSON.stringify({d,n:streak}))}catch(e){streak=1}
if(!TH[ti]||best<TH[ti].u)ti=0;bgH=T().h;
try{Object.assign(pk,JSON.parse(localStorage.getItem('towertap-pk')||'{}'))}catch(e){}pkUpdate();
$('streak').textContent=streak>1?'🔥 '+streak+'-day streak! Play daily to keep it going':'Play every day to build a streak';
renderThemes();
document.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c||c.disabled)return;if(c.dataset.p){pk[c.dataset.p]=pk[c.dataset.p]?0:1;try{localStorage.setItem('towertap-pk',JSON.stringify(pk))}catch(e){}pkUpdate();renderThemes();return}ti=+c.dataset.i;bgH=T().h;try{localStorage.setItem('towertap-theme',ti)}catch(e){}renderThemes()});
try{runs=JSON.parse(localStorage.getItem('towertap-runs')||'[]')}catch(e){}
function renderBoard(){$('btitle').textContent='Your best runs';$('blist').innerHTML=runs.length?runs.map((v,i)=>`<li><b>${['🥇','🥈','🥉'][i]||i+1}</b><span>Run ${i+1}</span><em>${v}</em></li>`).join(''):'<li class="empty">No scores yet. Play a round!</li>';$('bnote').textContent='Your best score is shown on YouTube.'}
function submit(){if(score>0){if(inYT)try{ytgame.engagement.sendScore({value:score}).catch(()=>{})}catch(e){}runs.push(score);runs.sort((a,b)=>b-a);runs=runs.slice(0,5);try{localStorage.setItem('towertap-runs',JSON.stringify(runs))}catch(e){}}}
document.addEventListener('click',e=>{if(e.target.closest('[data-board]')){renderBoard();$('board').classList.remove('hidden');if(state==='play')paused=true}else if(e.target.closest('#bclose')){$('board').classList.add('hidden');paused=false}});
function resize(){const r=cvs.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);cw=r.width;ch=r.height;cvs.width=cw*dpr;cvs.height=ch*dpr;s=cw/W}
function beep(c){if(muted||!ytA)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='triangle';o.frequency.value=c<0?110:c?440*Math.pow(1.0595,Math.min(c,12)*2):220;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.26)}catch(e){}}
const CH=[[110,[0,3,7]],[87.31,[0,4,7]],[130.81,[0,4,7]],[98,[0,4,7]]],hz=(f,n)=>f*Math.pow(2,n/12);
let nbuf;
function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(mus);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(mus);o.start(t);o.stop(t+.17)}
function hat(t){if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}const n=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;g.gain.value=.14;n.buffer=nbuf;n.connect(f);f.connect(g);g.connect(mus);n.start(t)}
function sched(){if(!ac||!mus)return;if(muted||!ytA||paused||yp||ac.state!=='running'){mNext=ac.currentTime+.1;return}
  while(mNext<ac.currentTime+.25){const bpm=104+Math.min(stack.length*1.2,46),dur=30/bpm,st=mStep%32,[root,iv]=CH[st>>3],p=st&7,t=mNext;
    if(state!=='over'){
      if(p===0||p===3||p===4||p===7)tone(p===3?hz(root,7):root,t,dur*1.8,'triangle',.55);
      tone(hz(root*4,iv[[0,1,2,1,0,1,2,1][p]]),t,dur*.9,'square',.05);
      if(state==='play'){if(p===0||p===4)kick(t);if(p&1)hat(t);
        if((combo>=3||stack.length>=12)&&(p&1)&&Math.random()<.6)tone(hz(440,[0,3,5,7,10,12][Math.random()*6|0]+(combo>=5?12:0)),t,dur*1.2,'square',.06)}}
    mNext+=dur;mStep++}}
function music(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();if(!mus){mus=ac.createGain();mus.gain.value=(muted||!ytA)?0:.22;mus.connect(ac.destination)}mNext=ac.currentTime+.05;mStep=0;if(!mTimer)mTimer=setInterval(sched,80)}catch(e){}}

function pkUpdate(){const m=Math.max(best,score||0);PK.forEach(p=>{const on=!!pk[p.k]&&m>=p.u;if(on&&!pa[p.k]&&state==='play'&&best<p.u){pops.push({t:0,i:stack.length+1,x:W/2,txt:p.e+' '+p.n.toUpperCase()+' UNLOCKED!'});burst(0,stack.length,W,36,bgH);vib([20,40,20])}pa[p.k]=on})}
function updRank(){const el=$('lrank');let r,n;if(db&&uid&&rows.length){n=rows.length;r=1+rows.filter(x=>x.id!==uid&&x.s>score).length}else if(runs.length){n=runs.length;r=1+runs.filter(v=>v>score).length}else{el.style.opacity=0;return}
  if(r<lastR&&lastR<99&&state==='play')pops.push({t:0,i:stack.length+1,x:W/2,txt:'🏆 RANK #'+r});lastR=r;el.textContent=r>n&&n>=10?'🏆 10+':'🏆 #'+r;el.style.opacity=state==='ready'?0:1}
function setScore(){const e=$('score');e.textContent=score;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');$('best').textContent='Best '+Math.max(best,score);pkUpdate();updRank()}
function spawn(){const n=stack.length,w=stack[n-1].w,left=n%2;cur={w,i:n,x:left?0:W-w};dir=left?1:-1;speed=130+Math.min(n*7,240)}
function reset(){stack=[{x:100,w:220,i:0}];score=0;combo=0;pieces=[];fx=[];pops=[];parts=[];life=0;lifeUI();cam=0;spawn()}
function mk(x,w,i){return{x,w,i,y:0,vy:-60,rot:0,vr:(Math.random()-.5)*2.4,a:1}}
function start(){reset();state='play';lastR=99;paused=false;music();$('menu').classList.add('hidden');$('over').classList.add('hidden');$('score').style.opacity=1;setScore();$('score').textContent=0}
function end(){state='over';shake=1;beep(-1);const lv=stack.length-1;if(lv>bestLvl){bestLvl=lv;try{localStorage.setItem('towertap-lvl',bestLvl)}catch(e){}}const ob=best,nb=score>best&&score>0;if(nb){best=score;try{localStorage.setItem('towertap-best',best)}catch(e){}}
  $('fs').textContent=score;const un=TH.concat(PK).find(t=>t.u>ob&&t.u<=best);$('fb').textContent=nb?'🎉 New best!'+(un?' Unlocked '+un.e+' '+un.n+'!':''):'Best '+best;pkUpdate();renderThemes();submit();$('rank').textContent=score<10?'Wobbly Starter':score<30?'Block Builder':score<60?'Architect':score<100?'Skyscraper Pro':'Tower Legend';vib(70);$('best').textContent='Best '+best;canRestart=false;
  setTimeout(()=>{$('over').classList.remove('hidden');canRestart=true},650)}
function place(){
  let pts=1;const top=stack[stack.length-1],l=Math.max(cur.x,top.x),r=Math.min(cur.x+cur.w,top.x+top.w),ov=r-l;
  if(ov<=0){pieces.push(mk(cur.x,cur.w,cur.i));if(life){life=0;combo=0;lifeUI();pops.push({t:0,i:cur.i,x:W/2,txt:'SAVED! ❤️'});vib(30);spawn();return}end();return}
  if(Math.abs(cur.x-top.x)<(pa.mg?10:5)){
    combo++;pts=1+Math.min(combo,4);cur.x=top.x;vib(12);
    if(combo>=3&&cur.w<220){cur.w=Math.min(220,cur.w+8);cur.x=Math.max(0,Math.min(W-cur.w,cur.x-4))}
    fx.push({x:cur.x,w:cur.w,i:cur.i,t:0});pops.push({t:0,i:cur.i,x:cur.x+cur.w/2,txt:combo>1?'PERFECT x'+combo+'  +'+pts:'PERFECT +'+pts});burst(cur.x,cur.i,cur.w,combo>=5?26:14,bgH);beep(combo);if(combo%4===0&&!life){life=1;lifeUI();pops.push({t:0,i:cur.i+1,x:cur.x+cur.w/2,txt:'❤️ SAVE EARNED'})}
  }else{
    combo=0;
    if(cur.x<top.x)pieces.push(mk(cur.x,top.x-cur.x,cur.i));else pieces.push(mk(r,cur.x+cur.w-r,cur.i));
    cur.x=l;cur.w=ov;beep(0);vib(8);
  }
  stack.push({x:cur.x,w:cur.w,i:cur.i});score+=pts;setScore();const L=stack.length-1;if(L===10||L===25||L%50===0){pops.push({t:0,i:L+1,x:W/2,txt:'🔥 '+L+' HIGH!'});burst(0,L,W,40,bgH);vib([20,40,20])}spawn();
}
function tap(){if(paused||yp)return;if(state==='play')place();else if(state==='ready')start()}
$('game').addEventListener('pointerdown',e=>{if(e.target.closest('button,#board'))return;e.preventDefault();tap()});
addEventListener('keydown',e=>{if(!$('board').classList.contains('hidden')||(e.target.closest&&e.target.closest('button,input')))return;if(e.code==='Space'||e.key==='Enter'){e.preventDefault();if(state==='over'){if(canRestart)start()}else tap()}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('board').classList.contains('hidden')){$('board').classList.add('hidden');paused=false}});
$('go').onclick=start;$('again').onclick=()=>{if(canRestart)start()};
addEventListener('resize',resize);

function update(dt){tm+=dt;if(pa.rb&&state==='play'){for(let k=0;k<2;k++)parts.push({x:cur.x+Math.random()*cur.w,i:cur.i,y:Math.random()*BH,vx:-dir*40*Math.random(),vy:-30+Math.random()*50,a:.9,h:(tm*140+Math.random()*60)%360})}
  if(state!=='over'){cur.x+=dir*speed*dt;if(cur.x<0){cur.x=0;dir=1}else if(cur.x>W-cur.w){cur.x=W-cur.w;dir=-1}}
  const n=stack.length,gy=ch-70,camT=Math.max(0,n*BH-(gy-ch*.42)/s);
  cam+=(camT-cam)*Math.min(1,dt*4);
  bgH+=(T().h+n*T().st-bgH)*Math.min(1,dt*2);
  pieces.forEach(p=>{p.vy+=1400*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.a-=dt*.7});pieces=pieces.filter(p=>p.a>0);
  fx.forEach(f=>f.t+=dt*2.5);fx=fx.filter(f=>f.t<1);
  pops.forEach(p=>p.t+=dt*1.1);pops=pops.filter(p=>p.t<1);
  shake=Math.max(0,shake-dt*3);
  parts.forEach(p=>{p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*1.3});parts=parts.filter(p=>p.a>0);
}
const sy=i=>ch-70-((i+1)*BH-cam)*s;
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function block(px,py,pw,ph,i,hh){const h=hh??T().h+i*T().st;ctx.fillStyle=`hsl(${h},70%,40%)`;rr(px,py,pw,ph,6);ctx.fill();ctx.fillStyle=`hsl(${h},85%,64%)`;rr(px,py,pw,ph-5,6);ctx.fill();ctx.fillStyle='rgba(255,255,255,.28)';rr(px+3,py+3,Math.max(0,pw-6),4,2);ctx.fill()}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,0,ch);const th=T();g.addColorStop(0,`hsl(${bgH},${th.sl}%,${th.sd}%)`);g.addColorStop(1,`hsl(${bgH+45},${th.sl}%,${Math.max(8,th.sd-16)}%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
  const sa=Math.min(1,Math.max(0,(stack.length-12)/25));
  if(sa>0){ctx.fillStyle=`rgba(8,10,40,${sa*.4})`;ctx.fillRect(0,0,cw,ch);ctx.fillStyle=`rgba(255,255,255,${sa*.9})`;stars.forEach(t=>{ctx.beginPath();ctx.arc(t.x*cw,t.y*ch,t.r,0,7);ctx.fill()});ctx.fillStyle=`rgba(255,246,205,${sa})`;ctx.beginPath();ctx.arc(cw*.8,ch*.15,24,0,7);ctx.fill()}
  ctx.fillStyle='rgba(255,255,255,.1)';
  bubbles.forEach(b=>{const y=((b.y*ch+cam*s*b.p)%(ch+160))-80;ctx.beginPath();ctx.arc(b.x*cw,y,b.r,0,7);ctx.fill()});
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*10*shake,(Math.random()-.5)*10*shake);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(-20,ch-70+cam*s,cw+40,ch);
  if(bestLvl>0&&state==='play'){const y=sy(bestLvl);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='700 13px sans-serif';ctx.textAlign='left';ctx.fillText('BEST',8,y-6)}
  const ph=BH*s;
  stack.forEach(b=>block(b.x*s,sy(b.i),b.w*s,ph,b.i));
  if(pa.mg&&state==='play'){const tb=stack[stack.length-1];ctx.strokeStyle=`rgba(255,255,255,${.45+.3*Math.sin(tm*6)})`;ctx.lineWidth=2.5;ctx.setLineDash([6,5]);rr((tb.x-10)*s,sy(tb.i)-3,(tb.w+20)*s,ph+6,9);ctx.stroke();ctx.setLineDash([])}
  if(state!=='over'){const hc=pa.rb?(tm*140)%360:null;if(combo>=5||pa.rb){ctx.shadowColor=pa.rb?`hsl(${hc},100%,70%)`:'#fff';ctx.shadowBlur=22}block(cur.x*s,sy(cur.i),cur.w*s,ph,cur.i,hc);ctx.shadowBlur=0}
  pieces.forEach(p=>{ctx.save();ctx.globalAlpha=Math.max(0,p.a);ctx.translate((p.x+p.w/2)*s,sy(p.i)+ph/2+p.y*s);ctx.rotate(p.rot);block(-p.w*s/2,-ph/2,p.w*s,ph,p.i);ctx.restore()});
  fx.forEach(f=>{const e=f.t*10;ctx.strokeStyle=`rgba(255,255,255,${1-f.t})`;ctx.lineWidth=3;rr((f.x-e)*s,sy(f.i)-e*s,(f.w+e*2)*s,ph+e*2*s,8);ctx.stroke()});
  ctx.textAlign='center';ctx.font="700 22px 'Fredoka',ui-rounded,system-ui,sans-serif";
  pops.forEach(p=>{ctx.fillStyle=`rgba(255,255,255,${1-p.t})`;ctx.fillText(p.txt,p.x*s,sy(p.i)-10-p.t*50)});
  parts.forEach(p=>{ctx.fillStyle=`hsla(${p.h},95%,72%,${Math.max(0,p.a)})`;ctx.beginPath();ctx.arc(p.x*s,sy(p.i)+p.y*s,3.5,0,7);ctx.fill()});
  ctx.restore();
}
let last=performance.now();
function frame(t){const dt=Math.min(.033,(t-last)/1000);if(yp){looping=false;return}last=t;if(!paused)update(dt);draw();requestAnimationFrame(frame)}
if(inYT){ytgame.system.onAudioEnabledChange(on=>{ytA=!!on;if(mus)mus.gain.value=(muted||!ytA)?0:.22});
ytgame.system.onPause(()=>{yp=true;flush();if(ac)ac.suspend()});
ytgame.system.onResume(()=>{yp=false;if(ac)ac.resume();if(!looping){looping=true;last=performance.now();requestAnimationFrame(frame)}})}
reset();resize();requestAnimationFrame(frame);
requestAnimationFrame(()=>{const b=document.getElementById('boot');if(b)b.remove();if(inYT)ytgame.game.gameReady()});
})();
</script>
